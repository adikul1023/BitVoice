name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --loglevel verbose
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=verbose
      - run: npm run build

  deploy:
    name: Deploy → EC2
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # Load NVM environment so node, npm, and pm2 are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22.14.0 --silent 2>/dev/null || true

            cd ~/BitVoice

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Installing dependencies ──"
            npm ci --no-audit --no-fund

            echo "── Compiling packages ──"
            npm run typecheck

            echo "── Restarting service ──"
            pm2 delete rendezvous 2>/dev/null || true
            pm2 start node \
              --name rendezvous \
              --cwd ~/BitVoice \
              -- --env-file=apps/rendezvous-service/.env \
                 --experimental-strip-types \
                 apps/rendezvous-service/src/server.ts

            pm2 save
            echo "── Deploy complete ──"
